name: Lycorine iOS app compile (unsigned; no jailbreak)

on:
  push:
    paths:
      - 'Lycorine/**'
      - 'Lycorine.xcodeproj/**'
      - '.github/workflows/lycorine-ios-compile.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcode-ios-compile:
    name: Compile iOS app (no TSS / signing)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Resolve public Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project Lycorine.xcodeproj \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/lycorine-spm" \
            2>&1 | tee "$RUNNER_TEMP/lycorine-spm.log"
      - name: Compile unsigned app for device
        id: build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project Lycorine.xcodeproj \
            -scheme Lycorine \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/lycorine-spm" \
            -derivedDataPath "$RUNNER_TEMP/lycorine-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            2>&1 | tee "$RUNNER_TEMP/lycorine-xcodebuild.log"
      - name: Validate app bundle (if available)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/lycorine-derived/Build/Products/Release-iphoneos/Lycorine.app"
          if [ -d "$APP" ]; then
            /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print UIFileSharingEnabled' "$APP/Info.plist" | grep -qi true
            /usr/libexec/PlistBuddy -c 'Print LSSupportsOpeningDocumentsInPlace' "$APP/Info.plist" | grep -qi true
            echo "Files sharing verified in compiled Info.plist"
            file "$APP/Lycorine" || true
            echo "This unsigned build is NOT a jailbreak or an Apple-authorized research cryptex."
          else
            echo "No completed app bundle was produced. Check compiler/package diagnostics."
          fi
      - name: Package unsigned IPA (UI and diagnostics only)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/lycorine-derived/Build/Products/Release-iphoneos/Lycorine.app"
          test -f "$APP/Lycorine"
          mkdir -p "$RUNNER_TEMP/lycorine-ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/lycorine-ipa/Payload/Lycorine.app"
          (
            cd "$RUNNER_TEMP/lycorine-ipa"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/Lycorine-unsigned-UI-only.ipa" Payload
          )
          /usr/bin/unzip -tq "$GITHUB_WORKSPACE/Lycorine-unsigned-UI-only.ipa"
          echo 'Unsigned IPA contains no usable jailbreak or custom Apple-signed cryptex.'
      - name: Upload unsigned diagnostic IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lycorine-unsigned-UI-only
          path: Lycorine-unsigned-UI-only.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lycorine-unsigned-xcode-logs
          path: |
            ${{ runner.temp }}/lycorine-spm.log
            ${{ runner.temp }}/lycorine-xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
